<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Left temple arm -->
  <line x1="1" y1="10" x2="5" y2="14" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left lens frame -->
  <circle cx="11" cy="17" r="7.5" stroke="#3b82f6" stroke-width="2.5" fill="#dbeafe"/>
  <!-- Bridge connecting the two lenses -->
  <path d="M18.5 17 Q16 14 13.5 17" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Right lens frame -->
  <circle cx="21" cy="17" r="7.5" stroke="#3b82f6" stroke-width="2.5" fill="#dbeafe"/>
  <!-- Right temple arm -->
  <line x1="31" y1="10" x2="27" y2="14" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left lens glare shine -->
  <circle cx="9" cy="14.5" r="1.5" fill="white" opacity="0.6"/>
  <!-- Right lens glare shine -->
  <circle cx="19" cy="14.5" r="1.5" fill="white" opacity="0.6"/>
</svg>
